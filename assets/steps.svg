<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="330" rx="24" fill="#0b1020"/>

  <!-- card 1: download -->
  <g transform="translate(32 32)">
    <rect width="284" height="266" rx="20" fill="#16213a" stroke="#2a3a5e" stroke-width="2"/>
    <circle cx="44" cy="44" r="24" fill="url(#n)"/><text x="44" y="53" fill="#fff" font-size="26" font-weight="800" text-anchor="middle">1</text>
    <g transform="translate(142 112)" stroke="#00c8ff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -40V20"/><path d="M-22 -2L0 20L22 -2"/><path d="M-40 34H40"/>
    </g>
    <text x="142" y="196" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">Download</text>
    <text x="142" y="230" fill="#9fb3d1" font-size="19" text-anchor="middle">the green button</text>
  </g>

  <!-- card 2: extract -->
  <g transform="translate(348 32)">
    <rect width="284" height="266" rx="20" fill="#16213a" stroke="#2a3a5e" stroke-width="2"/>
    <circle cx="44" cy="44" r="24" fill="url(#n)"/><text x="44" y="53" fill="#fff" font-size="26" font-weight="800" text-anchor="middle">2</text>
    <g transform="translate(142 108)">
      <path d="M-50 -30H-14L-4 -18H50V40H-50Z" fill="#f2c94c"/>
      <rect x="-8" y="-18" width="16" height="58" fill="#c9a23a"/>
      <path d="M-8 -6H8M-8 6H8M-8 18H8" stroke="#16213a" stroke-width="4"/>
    </g>
    <text x="142" y="196" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">Extract All</text>
    <text x="142" y="230" fill="#9fb3d1" font-size="19" text-anchor="middle">right-click the ZIP</text>
  </g>

  <!-- card 3: run -->
  <g transform="translate(664 32)">
    <rect width="284" height="266" rx="20" fill="#16213a" stroke="#2a3a5e" stroke-width="2"/>
    <circle cx="44" cy="44" r="24" fill="url(#n)"/><text x="44" y="53" fill="#fff" font-size="26" font-weight="800" text-anchor="middle">3</text>
    <g transform="translate(142 108)">
      <rect x="-46" y="-40" width="92" height="80" rx="10" fill="#0f1729" stroke="#00c8ff" stroke-width="4"/>
      <text x="0" y="-12" fill="#00c8ff" font-size="16" font-family="Consolas, monospace" text-anchor="middle">C:\&gt;_</text>
      <path d="M8 4L8 44L18 34L26 50L33 46L25 31L39 31Z" fill="#ffffff" stroke="#0b1020" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="142" y="196" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">SETUP.bat</text>
    <text x="142" y="230" fill="#9fb3d1" font-size="19" text-anchor="middle">double-click it, radio plugged in</text>
  </g>

  <!-- card 4: play -->
  <g transform="translate(980 32)">
    <rect width="268" height="266" rx="20" fill="#16213a" stroke="#2bd67b" stroke-width="2"/>
    <circle cx="44" cy="44" r="24" fill="#2bd67b"/><text x="44" y="53" fill="#0b1020" font-size="26" font-weight="800" text-anchor="middle">4</text>
    <g transform="translate(134 108)">
      <circle r="48" fill="#0f1729" stroke="#2bd67b" stroke-width="4"/>
      <path d="M-14 -24L26 0L-14 24Z" fill="#2bd67b"/>
    </g>
    <text x="134" y="196" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">Play</text>
    <text x="134" y="230" fill="#9fb3d1" font-size="19" text-anchor="middle">restart PC, open Roblox,</text>
    <text x="134" y="254" fill="#9fb3d1" font-size="19" text-anchor="middle">calibrate in the game</text>
  </g>
</svg>
